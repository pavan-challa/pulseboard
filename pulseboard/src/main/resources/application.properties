spring.application.name=pulseboard

# --- MySQL connection (local) ---
spring.datasource.url=jdbc:mysql://localhost:3306/pulseboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=none because schema.sql (below) owns table creation, per the fixed 3-table schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Schema init: run schema.sql on every startup (safe, uses CREATE TABLE IF NOT EXISTS) ---
spring.sql.init.mode=always

# --- Server ---
server.port=${PORT:8080}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Mail (Phase 2 alerts) ---
# Uncomment and fill in to enable email alerts. Until spring.mail.host is set,
# EmailAlertObserver simply isn't created and LoggingAlertObserver (console log)
# is the only alert channel - the app still runs fine either way.
# Gmail: use an "app password", not your normal password (Google Account > Security > App passwords).
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Where incident alert emails get sent - change this to your own address.
app.alert.recipient-email=revanthchalla01@gmail.com

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
